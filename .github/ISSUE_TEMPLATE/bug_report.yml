name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must NOT be reported here.** Please follow the [security policy](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Config values, the request you sent (user-agent / payload), and what came back.
      placeholder: |
        1. Set `mode` to `block`
        2. Send request with user-agent `...`
        3. Expected 403, got 200
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "11.x"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The relevant parts of your `config/ai-guard.php` (redact IPs/keys).
      render: php

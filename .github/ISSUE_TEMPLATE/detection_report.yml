name: Detection gap or false positive
description: A bot/payload slipped through, or legitimate traffic is being flagged
labels: [detection]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Report type
      options:
        - Detection gap (threat not detected)
        - False positive (legitimate traffic flagged)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: User-agent string or payload
      description: The exact user-agent or input that was missed / wrongly flagged.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which detector was involved (bot signatures, prompt injection, fingerprinting, PII scan), the confidence score logged, and why you believe it's wrong.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer-flags: EOL Laravel versions have unpatched security advisories,
        # so Composer >= 2.10 refuses to install them without --no-blocking
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            composer-flags: '--no-blocking'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            composer-flags: '--no-blocking'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            composer-flags: '--no-blocking'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            composer-flags: '--no-blocking'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            composer-flags: '--no-blocking'
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            composer-flags: '--no-blocking'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            composer-flags: ''
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            composer-flags: ''
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            composer-flags: ''
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            composer-flags: ''
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            composer-flags: ''

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction ${{ matrix.composer-flags }}

      - name: Run tests
        run: vendor/bin/phpunit

  laravel-ai:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'

    # The optional laravel/ai integration (agent middleware, guarded tools, MCP client tools)
    name: laravel/ai — PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require laravel/ai laravel/mcp --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # PHP 8.1 resolves Laravel 10 + larastan 2.x, the verified analysis baseline
          php-version: '8.1'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-blocking

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  static-analysis-latest:
    runs-on: ubuntu-latest
    name: PHPStan (Laravel 13, Larastan 3)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The current toolchain: PHPStan 2 + Larastan 3 on the newest Laravel
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer require laravel/ai laravel/mcp --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      # Includes src/Integrations, which the PHP 8.1 baseline cannot load
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan-integrations.neon.dist --no-progress --error-format=github

  code-style:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-blocking

      - name: Run Pint
        run: vendor/bin/pint --test

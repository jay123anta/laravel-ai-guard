name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer-flags: EOL Laravel versions have unpatched security advisories,
        # so Composer >= 2.10 refuses to install them without --no-blocking
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            composer-flags: '--no-blocking'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            composer-flags: '--no-blocking'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            composer-flags: '--no-blocking'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            composer-flags: '--no-blocking'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            composer-flags: '--no-blocking'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            composer-flags: ''
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            composer-flags: ''

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction ${{ matrix.composer-flags }}

      - name: Run tests
        run: vendor/bin/phpunit
